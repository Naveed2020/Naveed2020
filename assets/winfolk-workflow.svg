  <title id="title">Winfolk — Service-business workflow</title>
  <desc id="desc">Five connected stages: lead intake, customer conversations, scheduling and jobs, field work, and financial operations. AI and automation, a tenant-aware platform, consent, and audit support the workflow. Winfolk is a private project in small-group real-world testing.</desc>
