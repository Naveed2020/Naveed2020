<svg xmlns="http://www.w3.org/2000/svg" width="420" height="856" viewBox="0 0 420 856" role="img" aria-labelledby="title desc">
  <title id="title">Winfolk — Service-business workflow</title>
  <desc id="desc">Mobile vertical flow through lead intake, customer conversations, scheduling and jobs, field work, and financial operations. AI and automation, a tenant-aware platform, consent, and audit support the workflow. Winfolk is a private project in small-group real-world testing.</desc>
